<!DOCTYPE html>
<html lang="zh-CN">
{% load static %}
    <style>
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>

    <!-- 添加视频背景 -->
    <video autoplay muted loop class="video-background">
        <source src="{% static '/video/users.webm' %}" type="video/mp4">
        Your browser does not support the video tag.
    </video>




<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听众主页</title>
    <link rel="stylesheet" href="{% static 'css/audience.css' %}">
</head>



<body>
    <div class="container">
        <!-- 头部信息区 -->
        <div class="header">
            <button class="enter-btn" type="button" onclick="window.location.href='/users/login/'">
                返回登录
            </button>
            <div class="user-info">你好！听众 {{ user.username }}</div>
        </div>

        <div id="welcome-popup" class="welcome-popup">
            <div>你好！</div>
            <div>听众 {{ user.username }}</div>
        </div>

        <!-- 演讲列表区 -->
        <div class="presentation-list-container">
            <div class="presentation-list" id="presentationList">
                <div class="empty-tip">加载中...</div>
            </div>
        </div>
    </div>
</body>


</html>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const popup = document.getElementById('welcome-popup');

        // 显示弹窗
        popup.style.display = 'block';

        // 3秒后触发缩小消失动画
        setTimeout(() => {
            popup.classList.add('hide');
        }, 2000); // 显示持续时间
    });

    // 动态加载演讲列表
    function loadAudiencePresentations() {
        fetch('/presentations/api/presentations/audience_list/')
            .then(res => res.json())
            .then(data => {
                const userId = data.user_id;
                const container = document.getElementById('presentationList');

                if (data.code !== 0 || !data.presentations) {
                    container.innerHTML = '<div class="empty-tip">加载失败</div>';
                    return;
                }

                const presentations = data.presentations;
                if (!presentations.length) {
                    container.innerHTML = '<div class="empty-tip">暂无演讲</div>';
                    return;
                }

                container.innerHTML = '';
                presentations.forEach(p => {
                    let btn = '';
                    if (p.status === 'LIVE') {
                        btn = `<button class="enter-btn" onclick="window.location.href='/presentations/audience_during_presentation/${p.id}?user_id=${userId}'">进入演讲</button>`;
                    } else if (p.status === 'FINISHED') {
                        btn = `<a href="/presentations/after/audience_after/${p.id}/${userId}/" class="enter-btn">查看报告</a>`;
                    } else {
                        btn = `<button class="enter-btn" disabled>待开始</button>`;
                    }

                    const html = `
                        <div class="presentation-item">
                            <div class="presentation-details">
                                <div class="presentation-name">${p.title}</div>
                                <div class="presentation-status">状态：${p.status_display}</div>
                            </div>
                            ${btn}
                        </div>`;
                    container.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(() => {
                const container = document.getElementById('presentationList');
                container.innerHTML = '<div class="empty-tip">加载失败</div>';
            });
    }

    // 初始化加载和轮询
    document.addEventListener('DOMContentLoaded', () => {
        loadAudiencePresentations();
        setInterval(loadAudiencePresentations, 10000);
    });
</script>
