<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/organizer.css' %}">
    <title>组织者主页</title>
    <style>
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
    <video autoplay muted loop class="video-background">
        <source src="{% static '/video/users.webm' %}" type="video/mp4">
    </video>
</head>
<body>
    <div class="container">
        <!-- 头部信息区 -->
        <div class="header">
            <button class="enter-btn" type="button" onclick="window.location.href='/users/login/'">
                返回登录
            </button>
            <div class="user-info">你好！组织者 {{ user.username }}</div>
        </div>

        <!-- 合并欢迎动画的创建演讲区域 -->
        <div class="create-section" id="create-section">
            <div class="welcome-title">
                <div>你好！</div>
                 <div>   组织者 {{ user.username }}</div>
                </div>

            {% if message %}
                <p style="color: red;">{{ message }}</p>
            {% endif %}

            <form method="post" action="/presentations/create/" class="create-form">
                {% csrf_token %}
                <input type="text" name="title" placeholder="输入演讲名称" required class="form-input">
                <input type="text" name="description" placeholder="输入演讲描述" required class="form-input">
                <select name="speaker_id" required class="form-select">
                    <option value="">请选择演讲者</option>
                    {% for speaker in speakers %}
                        <option value="{{ speaker.id }}">{{ speaker.username }}</option>
                    {% endfor %}
                </select>
                <button type="submit" class="create-btn">创建</button>
            </form>
        </div>

        <!-- 演讲列表区 -->
        <div class="presentation-list-container">
        <div class="presentation-list" id="presentationList">
            <div class="empty-tip">加载中...</div>
        </div>

        </div>
    </div>

    <script>

                // 可以添加前端验证或AJAX提交逻辑
        document.querySelector('.create-form').addEventListener('submit', function(e) {
            const input = this.querySelector('.presentation-input');
            if (input.value.trim() === '') {
                e.preventDefault();
                alert('请输入演讲名称');
            }
        });


        document.addEventListener('DOMContentLoaded', function() {
            const createSection = document.getElementById('create-section');

            // 初始状态设置
            createSection.classList.add('welcome-animation');

            // 3秒后移除欢迎动画
            setTimeout(() => {
                createSection.classList.remove('welcome-animation');
            }, 2000);
        });

        function loadPresentationList() {
            fetch('/presentations/api/presentations/list/')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('presentationList');
                    const userId = data.user_id;
                    if (data.code !== 0 || !data.presentations) {
                        container.innerHTML = '<div class="empty-tip">加载失败</div>';
                        return;
                    }

                    const presentations = data.presentations;
                    if (!presentations.length) {
                        container.innerHTML = '<div class="empty-tip">暂无演讲</div>';
                        return;
                    }

                    container.innerHTML = '';  // 清空旧内容

                    presentations.forEach(p => {
                        let actionBtn = '';
                        if (p.status === 'PENDING') {
                            actionBtn = `<button class="enter-btn" onclick="window.location.href='/presentations/manage/${p.id}/'">管理</button>`;
                        } else if (p.status === 'LIVE') {
                            actionBtn = `<button class="enter-btn" onclick="window.location.href='/presentations/during/${p.id}/'">进入演讲</button>`;
                        } else if (p.status === 'FINISHED') {
                            actionBtn = `<a href="/presentations/after/organizer_after/${p.id}/${userId}/" class="enter-btn">查看报告</a>`;
                        }

                        const html = `
                            <div class="presentation-item">
                                <div class="presentation-details">
                                    <div class="presentation-name">${p.title}</div>
                                    <div class="presentation-status">状态：${p.status_display}</div>
                                </div>
                                ${actionBtn}
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', html);
                    });
                })
                .catch(() => {
                    const container = document.getElementById('presentationList');
                    container.innerHTML = '<div class="empty-tip">加载失败</div>';
                });
        }

        // 页面加载后执行一次，并每10秒轮询
        document.addEventListener('DOMContentLoaded', function () {
            loadPresentationList();
            setInterval(loadPresentationList, 10000);
        });


    </script>
</body>
</html>
