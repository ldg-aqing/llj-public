<h1>组织者报告：{{ presentation.title }}</h1>
<h2>全部反馈（含敏感内容和统计）</h2>
{% for fb in feedbacks %}
    <div>
        <b>{{ fb.user.username }}</b>（{{ fb.submitted_at|date:"Y-m-d H:i" }})<br>
        类型：{{ fb.get_category_display }}<br>
        内容：{{ fb.reason }}
    </div>
    <hr>
{% empty %}
    <p>暂无反馈。</p>
{% endfor %}
