<!DOCTYPE html>
<html lang="zh-CN">

{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观众页面 - 演讲互动系统</title>
        <link rel="stylesheet" href="{% static 'css/audience_duringp.css' %}">
</head>
<body>
    <div class="container">
        <div class="presentation-info">
    <button class="home-button" onclick="window.location.href='/presentations/audience/'">
        <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
        </svg>
        <span>返回主页</span>
    </button>
            <h1 class="presentation-title" id="presentationTitle">加载中...</h1>
            <div class="presentation-meta">
                <div class="meta-item"><span class="meta-label">组织者:</span> <span id="organizerName">加载中...</span></div>
                <div class="meta-item"><span class="meta-label">演讲者:</span> <span id="speakerName">加载中...</span></div>
                <div class="meta-item"><span class="meta-label">参与人数:</span> <span id="attendeeCount">加载中...</span></div>
            </div>
        </div>
        <div class="feedback-section">
            <h2 class="section-title">听众反馈</h2>
    <div class="feedback-form">
        <select id="feedbackCategory" class="feedback-input" style="max-width: 150px;">
            <option value="">反馈类型</option>
            <option value="SPEAKER">演讲者</option>
            <option value="QUIZ">题目</option>
            <option value="ENVIRONMENT">环境</option>
        </select>
        <input type="text" class="feedback-input" id="feedbackInput" placeholder="请输入您的反馈..." />
        <button class="submit-btn" id="submitFeedback">提交</button>
    </div>
<ul class="feedback-list" id="feedbackList">
    <li class="empty-tip">正在加载反馈数据...</li>
</ul>
      </div>
 <!-- 问题部分 -->
    <div class="question-section">
    <h2 class="section-title">互动题目</h2>
    <div class="question-list" id="questionList">
        <!-- 这里会动态生成单题容器 -->
    </div>
    <div class="question-navigation">
        <button class="nav-btn" id="prevQuestionBtn" disabled>上一题</button>
        <div class="question-counter" id="questionCounter">0/0</div>
        <button class="nav-btn" id="nextQuestionBtn" disabled>下一题</button>
    </div>
    </div>
    </div>
<script src="{% static 'js/common-polling.js' %}"></script>
    <script>

// 获取CSRF Token的通用方法
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

const user_id = getUserIdFromURL();
const csrftoken = getCookie('csrftoken');
const presentationId = "{{ presentation_id }}";
console.log("presentationId from template:", presentationId);

let pageData = {};
let currentQuestionIndex = 0;
let questions = [];

document.addEventListener('DOMContentLoaded', function () {
    fetch(`/presentations/api/presentations/audience_detail/${presentationId}/?user_id=${user_id}`)

        .then(res => res.json())
        .then(data => {
            pageData = data;
            loadPresentationData();
            loadFeedbacks();
            loadQuestions();
            bindEvents();
            setInterval(() => {
            fetch(`/presentations/api/presentations/audience_detail/${presentationId}/?user_id=${user_id}`)
                .then(res => res.json())
                .then(data => {
                    const oldStatuses = questions.map(q => q.status);
                    const newStatuses = data.questions.map(q => q.status);

                    // 如果题目状态发生变化，刷新渲染
                    const hasChanged = newStatuses.some((status, i) => status !== oldStatuses[i]);
                    if (hasChanged) {
                        pageData = data;
                        loadQuestions();
                        showQuestion(currentQuestionIndex);
                    }
                     pageData.feedbacks = data.feedbacks;
                     loadFeedbacks();
                })
                .catch(() => {
                    console.warn('轮询失败');
                });
        }, 15000);  // 每 15 秒检测一次
        })
        .catch(() => {
            document.getElementById('presentationTitle').textContent = "加载失败";
            document.getElementById('questionList').innerHTML = '<div class="empty-tip">获取数据失败</div>';
        });
});

function loadPresentationData() {
    const p = pageData.presentation || {};
    document.getElementById('presentationTitle').textContent = p.title || '';
    document.getElementById('organizerName').textContent = p.organizer || '';
    document.getElementById('speakerName').textContent = p.speaker || '';
    document.getElementById('attendeeCount').textContent = p.attendee_count || '0';
}

function loadFeedbacks() {
    const container = document.getElementById('feedbackList');
    const feedbacks = pageData.feedbacks || [];
    if (!feedbacks.length) {
        container.innerHTML = '<div class="empty-tip">暂无反馈</div>';
        return;
    }
    let html = '';
    feedbacks.forEach(feedback => {
        html += `<li class="feedback-item">
            <div class="feedback-content">${feedback.content}</div>
            <div class="feedback-user">${feedback.user}<br><small>${feedback.time}</small></div>
        </li>`;
    });
    container.innerHTML = html;
}

function loadQuestions() {
    const container = document.getElementById('questionList');
    questions = pageData.questions || [];

    if (!questions.length) {
        container.innerHTML = '<div class="empty-tip">暂无题目</div>';
        document.getElementById('prevQuestionBtn').disabled = true;
        document.getElementById('nextQuestionBtn').disabled = true;
        return;
    }

    container.innerHTML = ''; // 清空

    questions.forEach((question, index) => {
        const statusClass = `status-${question.status}`;
        const statusText = {
            'active': '进行中',
            'completed': '已结束'
        }[question.status] || question.status;

        const selectedOptionId = question.user_answer ? question.user_answer.option_id : null;

        let optionsHtml = '';
        (question.options || []).forEach((option, i) => {
            const checked = option.id === selectedOptionId ? 'checked' : '';
            optionsHtml += `
                <li class="question-option">
                    <input type="radio" id="question-${question.id}-option-${i}" name="question-${question.id}" value="${option.id}" data-option-id="${option.id}" class="option-radio" ${checked} />
                    <label for="question-${question.id}-option-${i}">${option.text}</label>
                </li>`;
        });

        const myAnswerSection = question.user_answer
            ? `<div class="my-answer" id="my-answer-${question.id}" style="display:block;">我的答案: ${question.user_answer.option_text}</div>`
            : '';

        let answerSection = '';
        let explanationSection = '';
        let actionsHtml = '';

        if (question.status === 'completed') {
            answerSection = `<div class="question-answer" style="display: block;"><span class="answer-label">参考答案:</span> ${question.answer}</div>`;
            explanationSection = `<div class="question-explanation" style="display: block;"><span class="explanation-label">解析:</span> ${question.explanation}</div>`;
        }

        if (question.status === 'active') {
            if (!question.user_answer) {
                actionsHtml = `<div class="question-actions"><button class="action-btn submit-answer-btn" data-question-id="${question.id}">提交答案</button></div>`;
            }
        }

        const html = `
        <div class="single-question-container" data-question-index="${index}" data-question-id="${question.id}">
            <div class="question-box">
                <div class="question-header">
                    <span class="question-title">${question.title}</span>
                    <span class="question-status ${statusClass}">${statusText}</span>
                </div>
                <div class="question-content">
                    <div class="question-text">${question.content}</div>
                    <ul class="question-options">${optionsHtml}</ul>
                </div>
                ${myAnswerSection}
                ${answerSection}
                ${explanationSection}
                ${actionsHtml}
                <div class="discussion-area" id="discussion-area-${question.id}">
                    <h3 style="margin-bottom:8px;">讨论区</h3>
                    <ul class="discussion-list" id="discussion-list-${question.id}"><li class="empty-tip">加载中...</li></ul>
                    <div class="discussion-form">
                        <input type="text" id="discussion-input-${question.id}" class="discussion-input" placeholder="请输入评论..." />
                        <button class="submit-btn" onclick="submitComment(${question.id})">提交评论</button>
                    </div>
                </div>
            </div>
        </div>`;
        container.insertAdjacentHTML('beforeend', html);
    });

    updateQuestionNavigation();
    showQuestion(0);
}


function showQuestion(index) {
    currentQuestionIndex = index;

    // 隐藏所有问题
    document.querySelectorAll('.single-question-container').forEach(container => {
        container.classList.remove('active');
    });

    // 显示当前问题
    const currentQuestion = document.querySelector(`.single-question-container[data-question-index="${index}"]`);
    if (currentQuestion) {
        currentQuestion.classList.add('active');
        // 加载该问题的评论
        const questionId = currentQuestion.dataset.questionId;
        loadCommentsForQuestion(questionId);
    }

    // 更新计数器
    document.getElementById('questionCounter').textContent = `${index + 1}/${questions.length}`;

    // 更新导航按钮状态
    updateQuestionNavigation();
}

function updateQuestionNavigation() {
    document.getElementById('prevQuestionBtn').disabled = currentQuestionIndex <= 0;
    document.getElementById('nextQuestionBtn').disabled = currentQuestionIndex >= questions.length - 1;
}

function loadCommentsForQuestion(quizId) {
    fetch(`/api/discussions/quiz/${quizId}/comments/`)
        .then(response => response.json())
        .then(data => {
            const ul = document.getElementById(`discussion-list-${quizId}`);
            if (data.code === 0 && data.data.length > 0) {
                ul.innerHTML = '';
                data.data.forEach(comment => {
                    const li = document.createElement('li');
                    li.classList.add('discussion-item');
                    li.innerHTML = `
                        <div class="discussion-content">${comment.content}</div>
                        <div class="discussion-user">${comment.user}<br><small>${comment.created_at}</small></div>
                    `;
                    ul.appendChild(li);
                });
            } else {
                ul.innerHTML = '<li class="empty-tip">暂无评论</li>';
            }
        });
}

function submitComment(quizId) {
    const input = document.getElementById(`discussion-input-${quizId}`);
    const content = input.value.trim();
    if (!content) {
        alert('请输入评论内容');
        return;
    }
    fetch(`/api/discussions/quiz/${quizId}/comments/post/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken,
        },
        body: JSON.stringify({
            user_id: user_id,
            content: content,
        }),
    })
    .then(res => res.json())
    .then(data => {
        if (data.code === 0) {
            input.value = '';
            loadCommentsForQuestion(quizId);
        } else {
            alert('评论提交失败: ' + data.msg);
        }
    })
    .catch(() => {
        alert('提交失败，网络错误');
    });
}

function bindEvents() {
    // 绑定反馈提交
    document.getElementById('submitFeedback').addEventListener('click', submitFeedback);

    // 绑定答题提交
    document.addEventListener('click', function (e) {
        if (e.target.classList.contains('submit-answer-btn')) {
            const questionId = parseInt(e.target.getAttribute('data-question-id'));
            submitAnswer(questionId);
        }
    });

    // 绑定导航按钮
    document.getElementById('prevQuestionBtn').addEventListener('click', () => {
        if (currentQuestionIndex > 0) {
            showQuestion(currentQuestionIndex - 1);
        }
    });

    document.getElementById('nextQuestionBtn').addEventListener('click', () => {
        if (currentQuestionIndex < questions.length - 1) {
            showQuestion(currentQuestionIndex + 1);
        }
    });
}

function submitFeedback() {
    const input = document.getElementById('feedbackInput');
    const categorySelect = document.getElementById('feedbackCategory');
    const content = input.value.trim();
    const category = categorySelect.value;

    if (!category) {
        alert('请选择反馈类型');
        return;
    }
    if (!content) {
        alert('请输入反馈内容');
        return;
    }

    fetch(`/api/feedbacks/${presentationId}/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken,
        },
        body: JSON.stringify({
            category: category,
            reason: content,
        }),
    })
    .then(res => res.json())
    .then(data => {
        if (data.code === 0) {
            alert('反馈提交成功');
            // 刷新页面
            window.location.reload();
        } else {
            alert('提交失败: ' + data.msg);
        }
    })
    .catch(() => {
        alert('提交失败，网络错误');
    });
}

function getUserIdFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get('user_id');
}

function submitAnswer(questionId) {
    const selectedInput = document.querySelector(`input[name="question-${questionId}"]:checked`);
    if (!selectedInput) {
        alert('请选择一个选项');
        return;
    }

    const optionId = selectedInput.dataset.optionId;
    const selectedInputId = selectedInput.id;

    fetch('/presentations/api/presentations/submit_answer/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken,
        },
        body: JSON.stringify({
            quiz_id: questionId,
            option_id: optionId,
            user_id: user_id,
        }),
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
    alert('提交成功');
    // 🔁 重新请求完整数据，刷新 questions
        fetch(`/presentations/api/presentations/audience_detail/${presentationId}/?user_id=${user_id}`)
            .then(res => res.json())
            .then(data => {
                pageData = data;
                loadQuestions();  // 重新渲染题目列表
                showQuestion(currentQuestionIndex);  // 保持在当前题目
            })
            .catch(() => {
                alert('刷新题目失败，请稍后重试');
            });

    // 更新 questions 中的 user_answer，避免刷新才能显示
    const q = questions.find(q => q.id === questionId);
    if (q) {
        const selectedLabel = selectedInputId ? document.querySelector(`label[for="${selectedInputId}"]`) : null;
        const answerText = selectedLabel ? selectedLabel.textContent : `选项ID:${optionId}`;

        q.user_answer = {
            option_id: parseInt(optionId),
            option_text: answerText
        };
    }

    // 禁用按钮
    let btn = document.querySelector(`.submit-answer-btn[data-question-id="${questionId}"]`);
    if (btn) {
        btn.disabled = true;
        btn.textContent = '已提交';
        btn.classList.add('submit-answer-btn-disabled');
    }

    // 找对应的 label，显示"我的答案"
    const selectedLabel = selectedInputId ? document.querySelector(`label[for="${selectedInputId}"]`) : null;
    const answerText = selectedLabel ? selectedLabel.textContent : `选项ID:${optionId}`;

    let myAnswerDiv = document.querySelector(`#my-answer-${questionId}`);
    if (!myAnswerDiv) {
        const questionContainer = document.querySelector(`.single-question-container[data-question-id="${questionId}"]`);
        const questionBox = questionContainer ? questionContainer.querySelector('.question-box') : null;

        if (questionBox) {
            myAnswerDiv = document.createElement('div');
            myAnswerDiv.id = `my-answer-${questionId}`;
            myAnswerDiv.className = 'my-answer';
            questionBox.appendChild(myAnswerDiv);
        }
    }


    }
     else   {
            alert(data.error || '提交失败');
        }
    })
    .catch(() => {
        alert('提交失败，网络错误');
    });
}


    </script>
</body>
</html>
