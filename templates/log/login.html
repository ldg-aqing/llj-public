
<html lang="en">
{% load static %}
{% block content %}

    <style>
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>

    <!-- 添加视频背景 -->
    <video autoplay muted loop class="video-background">
        <source src="{% static '/video/background.webm' %}" type="video/mp4">
        Your browser does not support the video tag.
    </video>


     <!-- 🚨 登录失败提示信息 -->
    {% if messages %}
        <ul class="error-messages">
            {% for message in messages %}
                <li style="color:red;">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>登录</title>
    <!-- 引入css文件 -->
    <link rel="stylesheet" href="{% static 'css/newlogin.css' %}">
    <!-- 引入jquery -->
    <script src="http://code.jquery.com/jquery-latest.js"></script>
</head>
    <body>
        <!-- 最外层的大盒子 -->
       <div class="box">
        <!-- 滑动盒子 -->
        <div class="pre-box">
            <h1>Pop quiz</h1>
            <p>更适合中国大学生体质</p>
            <div class="img-box">
                <img src="{% static 'img/waoku.jpg' %}" alt="">

            </div>
        </div>


        <!-- 注册盒子 -->
        <div class="register-form">
            <!-- 标题盒子 -->
            <div class="title-box">
                <h1>注册</h1>
            </div>
            <!-- 输入框盒子 -->
                      <form method="post">
                          <input type="hidden" name="form_type" value="register">
                {% csrf_token %}
                <div class="input-box">
                    <input type="text" name="username" placeholder="用户名" required>
                    <input type="email" name="email" placeholder="邮箱" required>
                    <input type="password" name="password" placeholder="密码" required>
                    <input type="password" name="password_confirm" placeholder="确认密码" required>
                    <select name="role" required class="styled-select">
                        <option value="" disabled selected>选择角色</option>
                        <option value="ORGANIZER">组织者</option>
                        <option value="SPEAKER">演讲者</option>
                        <option value="AUDIENCE">听众</option>
                    </select>
                </div>
                <div class="btn-box">
            <button type="submit">注册</button>
                                    <!-- 绑定点击事件 -->
                <p onclick="mySwitch()">已有账号?去登录</p>
                    </div>
            </form>
            </div>






        <!-- 登录盒子 -->
        <div class="login-form"action="{% url 'login' %}">
            <!-- 标题盒子 -->
            <div class="title-box">
                <h1>登录</h1>
            </div>
            <!-- 输入框盒子 -->
            <form method="post">
                <input type="hidden" name="form_type" value="login">
                {% csrf_token %}
            <div class="input-box">
                <input type="text" id="username" name="username" placeholder="用户名">
                <input type="password" id="password" name="password" placeholder="密码">
            </div>
            <!-- 按钮盒子 -->
            <div class="btn-box">
                <button>登录</button>
                <!-- 绑定点击事件 -->
                <p onclick="mySwitch()">没有账号?去注册</p>
            </div>
            </form>
        </div>

       </div>

       <script>

            function validateRegister() {
                const password = document.getElementById('regPassword').value;
                const passwordConfirm = document.getElementById('regPasswordConfirm').value;
                const role = document.getElementById('regRole').value;

                if (password !== passwordConfirm) {
                    alert('两次输入的密码不一致');
                    return false;
                }

                if (!role) {
                    alert('请选择角色');
                    return false;
                }

                return true;
            }

            // 滑动的状态
             let flag=true
             const mySwitch=()=>{
                if(flag){
                    // 获取到滑动盒子的dom元素并修改它移动的位置
                    $(".pre-box").css("transform","translateX(100%)")
                    // 获取到滑动盒子的dom元素并修改它的背景颜色
                    $(".pre-box").css("background-color","#f685a3")
                    //修改图片的路径
                    $("img").attr("src","{% static 'img/wuwu.jpeg' %}")

                }
                else {
                    $(".pre-box").css("transform","translateX(0%)")
                    $(".pre-box").css("background-color","#4090eb")
                    $("img").attr("src","{% static 'img/waoku.jpg' %}")
                }
                flag=!flag
             }
       </script>
       <script>
            const bubleCreate=()=>{
                // 获取body元素
                const body = document.body
                // 创建泡泡元素
                const buble = document.createElement('span')
                // 设置泡泡半径
                let r = Math.random()*5 + 25 //半径大小为25~30
                // 设置泡泡的宽高
                buble.style.width=r+'px'
                buble.style.height=r+'px'
                // 设置泡泡的随机起点
                buble.style.left=Math.random()*innerWidth+'px'
                // 为body添加buble元素
                body.append(buble)
                // 4s清除一次泡泡
                setTimeout(()=>{
                    buble.remove()
                },4000)
            }
            // 每200ms生成一个泡泡
            setInterval(() => {
                bubleCreate()
            }, 200);
        </script>
    </body>






</html>
{% endblock %}
